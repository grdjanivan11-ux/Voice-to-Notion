<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Voice to Notion — Microphone Permission</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: grid;
      place-items: center;

      background: #09090b;
      color: white;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .card {
      width: min(520px, calc(100% - 40px));

      padding: 32px;

      border: 1px solid #27272a;
      border-radius: 20px;

      background: #18181b;
    }

    h1 {
      margin: 0;

      font-size: 28px;
    }

    p {
      color: #a1a1aa;

      line-height: 1.6;
    }

    button {
      width: 100%;

      margin-top: 16px;
      padding: 14px 18px;

      border: 0;
      border-radius: 12px;

      background: white;
      color: black;

      font-weight: 700;

      cursor: pointer;
    }

    button:hover {
      background: #e4e4e7;
    }

    .success {
      margin-top: 20px;
      padding: 14px;

      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 12px;

      background: rgba(34, 197, 94, 0.1);
      color: #4ade80;
    }

    .error {
      margin-top: 20px;
      padding: 14px;

      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 12px;

      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
    }
  </style>
</head>

<body>
  <main class="card">

    <h1>
      Enable Microphone
    </h1>

    <p>
      Voice to Notion needs microphone access so
      you can record your voice notes.
    </p>

    <p>
      Chrome should ask you to allow microphone
      access after you click the button below.
    </p>

    <button
      id="permissionButton"
      type="button"
    >
      Allow Microphone
    </button>

    <div
      id="successBox"
      class="success"
      hidden
    >
      Microphone permission granted. You can close
      this tab and use Voice to Notion.
    </div>

    <div
      id="errorBox"
      class="error"
      hidden
    ></div>

  </main>

  <script src="mic-permission.js"></script>
</body>
</html>
